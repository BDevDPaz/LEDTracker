<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="glassBgAdp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glassBorderAdp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="beamGradientAdp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
    </linearGradient>
    
    <filter id="glowAdp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyGlowAdp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- NOTE: No solid background. Expo will place this over the backgroundColor defined in app.json -->

  <!-- Dark Glass Container -->
  <rect x="162" y="162" width="700" height="700" rx="180" ry="180" fill="url(#glassBgAdp)" stroke="url(#glassBorderAdp)" stroke-width="6" />

  <!-- Radar Rings -->
  <g stroke="#ffffff" fill="none">
    <circle cx="512" cy="512" r="280" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="512" cy="512" r="160" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="512" cy="512" r="60" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Radar Crosshairs -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="2">
    <line x1="512" y1="202" x2="512" y2="822" />
    <line x1="202" y1="512" x2="822" y2="512" />
  </g>

  <!-- The Ray -->
  <polygon points="512,512 850,174 950,230" fill="url(#beamGradientAdp)" filter="url(#heavyGlowAdp)" />
  <line x1="200" y1="824" x2="824" y2="200" stroke="#00E5FF" stroke-width="8" filter="url(#glowAdp)" />
  <line x1="200" y1="824" x2="824" y2="200" stroke="#FFFFFF" stroke-width="3" />

  <!-- Nodes -->
  <g transform="translate(300, 724)">
    <circle cx="0" cy="0" r="14" fill="#34C759" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
  <g transform="translate(650, 374)">
    <circle cx="0" cy="0" r="18" fill="#007AFF" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>
  <g transform="translate(232, 512)">
    <circle cx="0" cy="0" r="10" fill="#FFCC00" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
  <g transform="translate(512, 232)">
    <circle cx="0" cy="0" r="10" fill="#FF9500" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
  <g transform="translate(730, 730)">
    <circle cx="0" cy="0" r="12" fill="#FF3B30" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>
  <g transform="translate(512, 512)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" filter="url(#glowAdp)" opacity="0.4" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#glowAdp)" />
    <circle cx="0" cy="0" r="7" fill="#00E5FF" />
  </g>
</svg>


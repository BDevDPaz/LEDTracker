<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#04070D" />
    </radialGradient>

    <!-- Dark Glass Effects -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Ray Beam Gradients -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Glow Filter for Nodes & Ray -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" />

  <!-- Subtle Topographic/Grid Lines (Background context) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="0" y1="256" x2="1024" y2="256" />
    <line x1="0" y1="512" x2="1024" y2="512" />
    <line x1="0" y1="768" x2="1024" y2="768" />
    <line x1="256" y1="0" x2="256" y2="1024" />
    <line x1="512" y1="0" x2="512" y2="1024" />
    <line x1="768" y1="0" x2="768" y2="1024" />
  </g>

  <!-- Dark Glass Container (Squircle) -->
  <rect x="162" y="162" width="700" height="700" rx="180" ry="180" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="4" />

  <!-- Radar Rings (Precision) -->
  <g stroke="#ffffff" fill="none">
    <circle cx="512" cy="512" r="280" stroke-opacity="0.06" stroke-width="2" />
    <circle cx="512" cy="512" r="160" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="512" cy="512" r="60" stroke-opacity="0.15" stroke-width="1" />
  </g>

  <!-- Radar Crosshairs -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2">
    <line x1="512" y1="202" x2="512" y2="822" />
    <line x1="202" y1="512" x2="822" y2="512" />
  </g>

  <!-- The "Ray" (Rayo de escaneo) -->
  <polygon points="512,512 850,174 950,230" fill="url(#beamGradient)" filter="url(#heavyGlow)" />
  <line x1="200" y1="824" x2="824" y2="200" stroke="#00E5FF" stroke-width="6" filter="url(#glow)" />
  <line x1="200" y1="824" x2="824" y2="200" stroke="#FFFFFF" stroke-width="2" />

  <!-- Audit Log Nodes (Representing your system_logs colors) -->
  
  <!-- 🟢 VERDE (Success) -->
  <g transform="translate(300, 724)">
    <circle cx="0" cy="0" r="14" fill="#34C759" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- 🔵 AZUL (System State) -->
  <g transform="translate(650, 374)">
    <circle cx="0" cy="0" r="18" fill="#007AFF" filter="url(#glow)" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- 🟡 AMARILLO (Warning) -->
  <g transform="translate(232, 512)">
    <circle cx="0" cy="0" r="10" fill="#FFCC00" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- 🟠 NARANJA (Special Event) -->
  <g transform="translate(512, 232)">
    <circle cx="0" cy="0" r="10" fill="#FF9500" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- 🔴 ROJO (Critical) -->
  <g transform="translate(730, 730)">
    <circle cx="0" cy="0" r="12" fill="#FF3B30" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>

  <!-- ⚪️ BLANCO (Core / Self) - Target Center -->
  <g transform="translate(512, 512)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" filter="url(#glow)" opacity="0.3" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#00E5FF" />
  </g>

</svg>

